/* =====================================================

const Knight = (function () {
  const ART = ["========================================================================================================================================================", "========================================================================================================================================================", "========================================================================================================================================================", "========================================================================================================================================================", "========================================================================================================================================================", "========================================================================================================================================================", "========================================================================================================================================================", "========================================================================================================================================================", "========================================================================================================================================================", "========================================================================================================================================================", "========================================================================================================================================================", "===========================================================================================+*+==========================================================", "===========================================================================================#%%==========================================================", "========================================================================================+#%##%%#+=======================================================", "=========================================================================================*%%@@#+========================================================", "==================================================================++*#**+==================@@%==========================================================", "===============================================================-*######%%@%+===============#@#==========================================================", "=============================================================+#++*######%%%%#+=============@@*==========================================================", "=============================================================#############%%%#+============%@*==========================================================", "============================================================+##%%%######%%%%%%#============%@*==========================================================", "============================================================*%#%@@%%%%%@@@@@@@@*===========#@*==========================================================", "===========================================================+#@%@@@%@%%@%@@@%@@@%*+========+%@*==========================================================", "===========================================================+%@@@@@@#%%@@@@@@@@@%%##+======+%@*==========================================================", "===========================================================#@@@%#@@@@@@@@@@@@@@%%####*==*++@@+==========================================================", "==========================================================-=#@@@@@@@@@@@@@@@@@%%%%%%%@+*##*%@+==========================================================", "===========================================================+%@@@@@@@@@@@@@@@@@%%%%@@%#*%%#=%@*++=+*+====================================================", "=====================================================-:..:.+*@@@@@@@@@@@@@@@@@%@@@@#%#@%#*+%%*#*####*+==================================================", "==================================================+:.::-:.:@@#@@@@@@@@@@@@@@@%@@@@*%#%%#=-*=++*#####%#*=================================================", "===============================================-=:==+*#####@@@@@@@@@@@@@@@@@@@@@@%%#%#%%@%%%#*=%%%###%%#+===============================================", "=============================================++*+*+%%######@@@@@@@@@@@@@@@@@@@@@%%%%%#*#**+*%#%%@@@%%%@%*+==============================================", "============================================-@%%%#%###%%#@%@@@@@%#*%@@@@@@@@@@@%%##%*#*##%*+##@@@@@@@@@@@%+=============================================", "============================================#%@@@%%%%%%%@@%%@@@@%%#%@@@@@@@%%@%##*###@@@@@@@%@@@@@@@@@@@@@+=============================================", "==========================================+++++%@@%##%@@@@@%@@@%%#@%##**%%@@%%####%%%%@@@@@%@@@@@@@@@@@@@@+=============================================", "========================================+#***#@%%@@%%@@@%@@@%%@%%%#%%@@@@@%%#####%%@@@@#@@@@@@@@@@@@@@@@@@*=============================================", "=======================================-:.-%@@%@@@@@@@@@@@%##@@@@#%%#%@@%%#%@@#*#%@@@@+@@@@@@@@@@@@@#%@@@@%=============================================", "==============================::::=##*#@@%++%@@%%@@@%%@@@##*#%@@#@#++##%%@@@@%#=%#@@#*@%%@@@@@@@@@@@%@@@@#+=============================================", "========================+**-:.:-=####**##%%%%@%%@@@@@@@@@@@@@@@@@%#+*%%#%@@@@@%@@%@#@@@@@@@@@@@@@@@%%@@@@%*=============================================", "=======================*%#+--=+=+##%##+#%@@%%@@@@@@@@@@@@@@@@@@@@@@%%@@%@@@@@@@%%@@@@@@@@@@@@@@@@@%%@@@@%+==============================================", "======================+#***#%%######%%%%@%@@%@@@@@@@@@@%#@@@@@@@%@@@@@@@@@%%@@@@@@@@@@@@@@@@@@@@@@@@%@@@#===============================================", "=====================+#%#%%#=#%@@@@@@%%##@@@%@@@@@@@@%#+=#@@@@@@@@%@@@%@@%@@@@@@@@@@@@@@@@@@@@@@@@@@@%@@#===============================================", "=====================+#@%%##%@%**#%@@@@@##@@@@@@#**======+@@%@%@%%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%+==============================================", "======================+#@#%%@@#+*%%%@@@@@%#*+*#*+=========#%#%%@@@@@%%@@@@@@@@@@@@@@@@@@%@@@@@@@@@@@@@@@@%*+============================================", "=======================+@%%@@@@@%###%@@@@@=-==============+##%@@@@@@@@@@@@@@@@@@@@@@@@@@%@@@%@@@@@@@@@@@@@@@============================================", "========================+%%@@@%%%%%#%@@@@@@@*-=============+*#%@@@@@@@@@@@@@@@@@@@@@@@@%#%@@@@@@@@@@@@@@@@@@*===========================================", "=======================-=#@@@@@@%**#%%%@@@@@@@%*=:-=========*##%@@@@@@@@@@@@@@@@@@@@@@@%*@@@%@@@@@@@@@@@@@@@#+++========================================", "======================-:*%@@@@@%@@%#%*#%@@@@@@@@%%*=+*+======**%%@@@@@@@@@@@@@@@@@@@@@@@#@@@%@@@@@@@@@@@@@@@@@@+========================================", "=====================-:*@@@@@@@@@@%%@@@@@@@@@@@@@@@%*--*-====+#@@@@@@@@@@@@@@@@@@@@@@@@%#@@@%@@@@@@@##@@@@%@@@+=========================================", "=====================*##%@@@@@@@%@@%%%%%%@@@@@@@@@@@@@%%*-=+===*@@%@@@@@@@@@@@@@@@@@@@@%#@@@@@@@@@@@@@@@@@@@@*==========================================", "=====================*@#%@@@@@@%%@@@%@@@%%@@@@@@@@@@@@@@@#*#=-#@%@@@%@@@@@@@@@@@@@@@@@@%#@@@@@@@@@@@@@@@@@@@*===========================================", "=====================%*+@@@@@@@%%%%%%%@@@@@@@@%%@@@@@@@@@@@@%+%@@@@@@@@@@@@@@@@@@@@@@@@%#@%@@@@@@@@@@@@@@@@*============================================", "=====================#**@@%%@@@@@@@@@@@@@%@@@@@@@@@@@@@@@@@@@@*@@@@@@@@@@@@@@@@@@@@@@@@%#%@@@@@@@@@@@@@@@@@@*===========================================", "=====================*#%@@@@@@@@@%@%%@%%@#%@@@@@@@@@@@@@@@@@@@@@@@%@@@@@@@@%*#%@@@@@@@@%*@@@@@%@@@@@@@@@@@@@@*==========================================", "=====================+#@@@%@@@@@@#%@%@@%@@%@@@@@@@%@@@@@@@@@@@@@@@@#%%%%%@@@@@@@@@@@@@@%*@@@@@%@@@@@@@@@@@@@@@+=========================================", "====================-+#@@@@@@@@@@#@@%%@%@%#%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%*@@@@@%@@@@@@@@@@@@@@@@=========================================", "====================+%#@@@@@@@@@@#%@@@@%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%@@@#*@@@@@%@@@@@@@@@@@@@@@@%+=======================================", "====================%%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%%%%@@@#*@@@@@%@@@@@@@@@@@@@%%@@#+======================================", "===================*#%@@@@@@@@@@@@%++**#@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%##**%@%%**@@@@@%@@@@@@@@@@@@@@*%@@#+=====================================", "==================+*%@%@@@@@@@@@@@======*#@@@@@@@@@@@@@@%@@@@@@@@@@@@@@@@#%@@@@#%***##%%#@@@@@%@@@@@@@@@@@@@@%+%@@%=====================================", "==================**@%%@@@@@@@@@%=======*#@%%@@@@@@@@@@@@@@@@@@@@@@@@@@@%@@@#++**#@@%%###@@@@@%@@@@@@@@@@@@@@@+=#@@%====================================", "=================-=%##%@@@@@@@@#========+#%%%%@@@@@@@@@@@@@@@@@@@@@@@@@#%#%#%@@@@@@%%####@@@@@%@@@@@@@@@@@@@@@%=+%@@#===================================", "=================+@%#%@@@@@@@@%+==========+#%%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%*#@@%%@%%%##@@@@@%@@@@@@@@@@@@@@@@#==%@@*==================================", "==============+***#%%@@@@@@@@@+============+%%@@@@@@@@@@@@@@@@@@@@@@@+%@%%#*#%%@@%@%####%@@@@@%@@@@@@%@@@@@@@@@@+==#@@*=================================", "=============+%@@@@@@@@@@@@@@+=======++**####*%@@@@@@@@@@@@@@@@@@@@@@###%#*==*##%%%#####%@@@@@%@@@@@@@%@@@@@@@@@#===#@@*================================", "=============*@@@@@@@@@@@@@@@+=====++**%@@#%%%%@@@@@@@@@@@@@@@@@@@@@@@@#%#%@@@@@######%%%@@@@@@@@@@@@@@%@@@@@@@@@#===#@@*===============================", "==============+###%@@@@@@@@@%===========+@%####%@@@@@@@@@@@@@@@@@@@@@@@%%####%%%@@#%##%%%@@@@@@@@@@@@@@%%@@@@@@@@@%+==%@%*==============================", "============--:+###%@@@@@@@@%+=============*%%%%@@@@@@@@@@@@@@@@@@@+=+=-=*++####@@@@%@@%@@@@@@@@@+=+%@@@@%%@@@@@@@@@#==%@%+=============================", "=========--*+*####%%@@@@@@@@@#=====================+*%@@@@@@@@@@%@#==:=-=++###%%@@@@@@@@@@@@@@@@#===*@@@@@@%%@@@@@@@@@@@@@@@%*+=========================", "=======-:+*%@@@@@@@@@@@@@@@@@*=======================+%@@%@@@@@%#@##%+%+##%%%##@@@@@@@@@@@@@@@@%+====*@@@%%@@@@@@@@@@@@@@@@@@@@@@%*=====================", "======***#@@@@@@@@@@@@@@@@@@*===========================*@@@@@@@*+=+#@#@@@%%%#@@@@@@@@@@@@@@@@@*======*@@@@%%@@%@@@@@@@@@@@@@@@@@@@@@*==================", "=====+%@#@@@@@@@@@@%%*++*+=================================*@@@##@@@@@@%@@@@@@@@@@@@@@@@@@@@@@%========*@@@@@%%@@@@@@@@@@@@@@@@@@@@@@@@+================", "=========+===================================================+%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@*=========*%@@@@@@@@@@@@@@@@@%%%%%%@@@@@@@#===============", "===============================================================#@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@+==========+%@@@@@@@@@@@@%%#########%@@@@@@@%%%##*+=======", "================================================================*@@@@@@@@@@@@@@@@@@@@@@@@@@@@%+============*@@@@@@@@@@@@@@@@@@@@@@%%%%@@@@@@@@@@%%%#====", "====================================================================+****##%@%@@@@@@@@@@@@@@@%+===============*%@@@@@@@@@@@@@@@@@@@@%%%@@@@@@@@@@@@@@%*+", "=============================================================================+#%@@%%%##*%@%@%%===================+*##@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@", "=======================================================================================+#%%%%#=========================+*%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@", "========================================================================================*%%%%*==============================+%@@@@@@@@@@@@@@@@@@@@@@@@@@", "========================================================================================+%%%%+==================================*%@@@@@@@@@@@@@@@@@@@@@@", "=========================================================================================#%%*=====================================+*%@@@@@@@@@@@@@@@@@@@", "=========================================================================================+%#+========================================*@@@@@@@@@@@@@@@@@@", "======================================================================================================================================+@@@@@@@@@@@@@@@@@", "=======================================================================================================================================+%@@@@@@@@@@@@@@@", "========================================================================================================================================+%@@@@@@@@@@@@@@", "=========================================================================================================================================+%@@@@@@@@@@@@@", "================================================================================================================================================+*%@@@@@", "===================================================================================================================================================+%@@@", "=====================================================================================================================================================#@@", "=====================================================================================================================================================+%@", "======================================================================================================================================================+%"];
  const R = ART.length, C = ART[0].length, MR = 20, MT = 6;
  const GC = C + MR, GR = R + MT, ASPECT = 1.83;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const BR = { '.':.15, ':':.2, '-':.25, '+':.35, '*':.45, '#':.58, '%':.72, '@':.9 };
  let hueOff = 0;

  const cells = [];
  for (let r = 0; r < R; r++) {
    const row = ART[r]; let start = 1e9;
    if (r >= 53 && r < 56) start = 111;
    else if (r >= 56 && r < 58) start = 112;
    else if (r >= 58) {
      let c = 90;
      if (row[c] !== '=') { while (c < C && row[c] !== '=') c++; while (c < C && row[c] === '=') c++; start = c; }
      else start = 90;
    }
    for (let c = 0; c < C; c++) {
      if (row[c] === '=') continue;
      cells.push({ r, c, ch: row[c], cape: c >= start, rnd: Math.random() });
    }
  }
  const cape = cells.filter(k => k.cape);
  let dmax = 0;
  for (const k of cape) { k.d = Math.hypot(k.c - 111, (k.r - 53) * ASPECT); dmax = Math.max(dmax, k.d); }
  for (const k of cape) k.s = k.d / dmax;

  const occ = ART.map(row => [...row].map(ch => ch !== '='));
  const isBg = (r, c) => r < 0 || c < 0 || r >= R || c >= C || !occ[r][c];
  for (const k of cells) {
    let dm = 99;
    for (let dr = -4; dr <= 4; dr++) for (let dc = -6; dc <= 6; dc++)
      if (isBg(k.r + dr, k.c + dc)) dm = Math.min(dm, Math.hypot(dc, dr * ASPECT));
    k.edge = dm <= 3.2 + k.rnd * 3.6;
    if (!k.edge) continue;
    const sweep = clamp((k.c / C) * .7 + (1 - k.r / R) * .3);
    k.dl = 2 + sweep * 6 + dm * .12 + k.rnd * .7;       // kapan mulai hancur
    k.rf = Math.max(k.dl + 3, 12.5 + sweep * 1.5);      // kapan terbentuk lagi
    k.fv = [0, 1].map(() => ({ sx: 6 + Math.random() * 16, sy: 1 + Math.random() * 7, ph: Math.random() * 6.28, ch: '.:\'`,'[Math.floor(Math.random() * 5)] }));
  }
  const P = 16, D = 2.4, DF = 3.4, FADE = 1.4;

  const sample = cape.filter((_, i) => i % 6 === 0);
  for (const k of cells) {
    if (k.cape) continue;
    let mind = 1e9;
    for (const s of sample) { const d = Math.hypot(k.c - s.c, (k.r - s.r) * ASPECT); if (d < mind) mind = d; }
    k.tint = clamp(1 - mind / 16); k.b = BR[k.ch] || .3;
  }
  function colorBody() {
    for (const k of cells) if (!k.cape) {
      k.h = 215 + (10 + hueOff - 215) * k.tint; k.sa = 18 + k.tint * 70; k.l = 20 + k.b * 48 + k.tint * 14;
    }
  }
  colorBody();

  const q = id => document.getElementById(id);
  const wrap = q('kwrap'), bg = q('bg'), cp = q('cape'), gl = q('glow'), g2 = q('glow2');
  const bx = bg.getContext('2d'), cx = cp.getContext('2d'), gx = gl.getContext('2d'), g2x = g2.getContext('2d');
  let cw, chh, fs, dpr;
  const put = (x, px, py, ch, col) => { x.fillStyle = col; x.fillText(ch, px * cw, (py + MT + 1) * chh - chh * .18); };

  function layout() {
    dpr = devicePixelRatio || 1;
    const Wd = innerWidth, Hd = innerHeight, boxH = Hd * .74;
    fs = Math.min(Wd / GC, boxH / (GR * ASPECT)) / 0.6;
    bx.font = fs + 'px "Courier New",monospace';
    cw = bx.measureText('M').width; chh = cw * ASPECT;
    const w = GC * cw, h = GR * chh;
    wrap.style.width = w + 'px'; wrap.style.height = h + 'px';
    wrap.style.left = ((Wd - w) / 2) + 'px'; wrap.style.top = (Hd * .02) + 'px';
    for (const [cv, x] of [[bg,bx],[cp,cx],[gl,gx],[g2,g2x]]) {
      cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + 'px'; cv.style.height = h + 'px';
      x.setTransform(dpr, 0, 0, dpr, 0, 0); x.font = fs + 'px "Courier New",monospace'; x.textBaseline = 'alphabetic';
    }
    drawBody();
  }
  function drawBody() {
    bx.clearRect(0, 0, bg.width, bg.height);
    for (const k of cells) if (!k.cape && !k.edge) put(bx, k.c, k.r, k.ch, `hsl(${k.h},${k.sa}%,${k.l}%)`);
  }

  function pos(k, t) {
    const s = k.s, ph = k.d * .2 - t * 3.0;
    const w = Math.sin(ph), w2 = Math.sin(ph * 1.7 - t * 1.3 + k.r * .1);
    return [
      k.c + Math.pow(s, 1.25) * 6 + s * s * w * 3.2 + s * w2 * 1.5,
      k.r - Math.pow(s, 1.5) * 15 + s * w * 3.2 + s * s * w2 * 2
    ];
  }
  function capeColor(k, t, a) {
    const I = .35 + .65 * (.5 + .5 * Math.sin(k.d * .35 - t * 4.5));
    const heat = I * (.45 + .55 * k.s);
    return `hsla(${6 + 42 * heat + hueOff},100%,${28 + 50 * heat}%,${a * (.55 + .45 * I)})`;
  }

  const embers = [];
  /* t = waktu global, ks = waktu sejak ksatria muncul */
  function draw(t, ks, dt) {
    const T = ks % P;
    cx.clearRect(0, 0, cp.width, cp.height);
    for (const k of cells) {
      if (!k.cape && !k.edge) continue;
      const base = k.cape ? pos(k, t) : [k.c, k.r];
      let a = 1, u = -1;
      if (k.edge) {
        if (T >= k.dl && T < k.dl + D) { u = (T - k.dl) / D; a = Math.max(0, 1 - u * 1.4); }
        else if (T >= k.dl + D && T < k.rf) a = 0;
        else if (T >= k.rf && T < k.rf + FADE) a = (T - k.rf) / FADE;
        if (T >= k.dl && T < Math.min(k.rf, k.dl + DF)) {
          const uf = (T - k.dl) / DF;
          for (const f of k.fv) {
            const x = base[0] + f.sx * Math.pow(uf, 1.3) + Math.sin(uf * 7 + f.ph) * 1.6 * uf;
            const y = base[1] - f.sy * uf + Math.cos(uf * 5 + f.ph) * .8 * uf;
            const al = (1 - uf) * (.55 + .45 * Math.sin(t * 20 + f.ph));
            const col = k.cape ? `hsla(${18 + 25 * (1 - uf) + hueOff},100%,${55 + 25 * (1 - uf)}%,${al})`
                               : `hsla(38,35%,${62 + 20 * (1 - uf)}%,${al})`;
            put(cx, x, y, f.ch, col);
          }
        }
      }
      if (a <= 0) continue;
      const ch = u < .4 ? k.ch : (u < .7 ? ':' : '.');
      if (k.cape) {
        for (const [lag, m] of (k.edge ? [[0, 1]] : [[0, 1], [.05, .4], [.1, .18]])) {
          const p = lag ? pos(k, t - lag) : base;
          put(cx, p[0], p[1], ch, capeColor(k, t - lag, a * m));
        }
      } else {
        const ash = u >= 0 ? clamp(u * 1.5) : 0;
        put(cx, base[0], base[1], ch, `hsla(${k.h + (38 - k.h) * ash},${k.sa}%,${k.l + 8 * ash}%,${a})`);
      }
    }
    for (let i = 0; i < 4; i++) {
      const k = cape[Math.floor(Math.random() * cape.length)];
      if (k.s < .75 || Math.random() > .6) continue;
      const [x, y] = pos(k, t);
      embers.push({ x, y, vx: (Math.random() - .3) * 2.5, vy: -(1 + Math.random() * 3), life: 1, ch: '.*\'`'[Math.floor(Math.random() * 4)] });
    }
    for (let i = embers.length - 1; i >= 0; i--) {
      const e = embers[i]; e.life -= dt * .7;
      if (e.life <= 0) { embers.splice(i, 1); continue; }
      e.x += e.vx * dt; e.y += e.vy * dt;
      put(cx, e.x, e.y, e.ch, `hsla(${20 + 30 * e.life + hueOff},100%,${55 + 25 * e.life}%,${e.life})`);
    }
    const pulse = .6 + .25 * Math.sin(t * 1.6);
    for (const x of [gx, g2x]) {
      x.save(); x.setTransform(1, 0, 0, 1, 0, 0);
      x.clearRect(0, 0, cp.width, cp.height);
      x.globalAlpha = pulse; x.drawImage(bg, 0, 0);
      x.globalAlpha = 1; x.drawImage(cp, 0, 0);
      x.restore();
    }
  }
  return {
    layout, draw,
    setOpacity: v => { wrap.style.opacity = v; },
    setHue: h => { hueOff = h; colorBody(); drawBody(); }
  };
})();

/* =====================================================
   SURAT: bintang, amplop, ksatria, judul, pesan
   ===================================================== */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let cfg = { title: 'The Sworn Blade', hue: 0,
  message: 'Hear me, Your Majesty, for I fear I shall not have the courage to speak twice.\n\nLong before I knew thy name, I swore an oath upon this blade.\n\nIf the door be open still, I am home.' };
let W, H, cols, rows, cw, chh, fs, stars = [], t0 = performance.now(), last = t0;

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const hsh = (x, y) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };

function resize() {
  const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  fs = W < 500 ? 11 : 14; chh = Math.round(fs * 1.15);
  ctx.font = fs + 'px "Courier New",monospace'; ctx.textBaseline = 'alphabetic';
  cw = ctx.measureText('M').width; cols = Math.floor(W / cw); rows = Math.floor(H / chh);
  stars = Array.from({ length: Math.floor(cols * rows / 45) }, () => ({ x: Math.random() * cols, y: Math.random() * rows, s: .3 + Math.random() * 1.2, p: Math.random() * 6 }));
  Knight.layout();
}
addEventListener('resize', resize);
addEventListener('pointerdown', () => {
  t0 = performance.now();
});

const put = (x, y, ch, col) => { ctx.fillStyle = col; ctx.fillText(ch, x * cw, (y + 1) * chh - 3); };
const hcy = () => rows * 0.40;

function envelope(x, y) {
  const ew = Math.min(cols - 6, 64), eh = Math.round(ew * 0.46);
  const x0 = Math.round((cols - ew) / 2), y0 = Math.round(hcy() - eh / 2);
  const u = (x - x0) / (ew - 1), v = (y - y0) / (eh - 1);
  if (u < 0 || u > 1 || v < 0 || v > 1) return 0;
  const m = 1 - Math.abs(2 * u - 1);
  if (Math.hypot((u - .5) * ew / 2, (v - .58) * eh) < 2.2) return -1;
  if (u < .012 || u > .988 || v < .02 || v > .98) return 1;
  if (Math.abs(v - .58 * m) < .045) return .95;
  if (v > .5 && Math.abs(v - (1 - .5 * m)) < .04) return .7;
  return .28 + .18 * hsh(x, y);
}
const RAMP = ".,:;/\\|+=*#%@";

function wrap(text, max) {
  const out = []; let line = '';
  for (const w of text.split(/\s+/)) {
    if ((line + ' ' + w).trim().length > max) { out.push(line); line = w; } else line = (line + ' ' + w).trim();
  }
  if (line) out.push(line); return out;
}
const CPS = 26; let pgCache = null, pgKey = '';
function pages() {
  const key = cols + 'x' + rows + cfg.message; if (key === pgKey) return pgCache; pgKey = key;
  const maxc = Math.min(cols - 6, 46), cap = Math.max(3, rows - Math.floor(rows * .78) - 1);
  const out = []; let cur = [];
  for (const para of cfg.message.split(/\n\n|\|/)) {
    let ls = wrap(para.trim(), maxc);
    while (ls.length > cap) { if (cur.length) { out.push(cur); cur = []; } out.push(ls.slice(0, cap)); ls = ls.slice(cap); }
    if (cur.length + ls.length > cap) { out.push(cur); cur = []; }
    cur = cur.concat(ls);
  }
  if (cur.length) out.push(cur);
  return pgCache = out;
}

function frame(now) {
  const t = (now - t0) / 1000, dt = Math.min(.05, (now - last) / 1000); last = now;
  const hue = cfg.hue, ehue = (hue + 25) % 360;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    s.x -= s.s * dt * 2; if (s.x < 0) s.x += cols;
    put(s.x, s.y, '.', `rgba(255,255,255,${.25 + .35 * Math.sin(now / 600 + s.p)})`);
  }

  // scene 1: amplop tersusun, lalu menghilang
  const p = clamp(t / 3.5), dp = clamp((t - 4) / 1.5);
  if (dp < 1) for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const b = envelope(x, y); if (!b) continue;
    if (dp > 0 && hsh(x + 7, y + 3) < dp) continue;
    const r = hsh(y, x) * .9;
    if (r > p + .25) continue;
    if (r > p) { put(x, y, RAMP[Math.floor(Math.random() * RAMP.length)], `hsl(${ehue},60%,22%)`); continue; }
    if (b < 0) put(x, y, '@', `hsl(280,85%,65%)`);
    else put(x, y, RAMP[Math.floor(clamp(b) * (RAMP.length - 1))], `hsl(${ehue},85%,${22 + b * 45}%)`);
  }

  // scene 2: ksatria menggantikan hati
  const ks = t - 4;
  if (ks > 0) { Knight.setOpacity(clamp(ks / 1.5)); Knight.draw(t, ks, dt); }
  else Knight.setOpacity(0);

  // judul + pesan
  if (t > 5) {
    const title = '~ ' + cfg.title + ' ~', n = Math.floor((t - 5) * 14);
    const s = title.slice(0, n), x0 = Math.round((cols - title.length) / 2);
    for (let i = 0; i < s.length; i++) put(x0 + i, 2, s[i], `hsl(${hue},90%,80%)`);
  }
  if (t > 6) {
    const pg = pages(), tt = t - 6; let acc = 0;
    for (let i = 0; i < pg.length; i++) {
      const n = pg[i].reduce((a, l) => a + l.length + 1, 0), dur = n / CPS + 2.4, isLast = i === pg.length - 1;
      if (isLast || tt < acc + dur + .6) {
        let k = Math.floor((tt - acc) * CPS), a = 1;
        if (!isLast) { const rem = acc + dur + .6 - tt; if (rem < .6) a = rem / .6; }
        const y0 = Math.floor(rows * .78);
        pg[i].forEach((ln, j) => {
          const seg = ln.slice(0, Math.max(0, k)); k -= ln.length + 1;
          const x0 = Math.round((cols - ln.length) / 2);
          for (let c = 0; c < seg.length; c++) put(x0 + c, y0 + j, seg[c], `rgba(242,230,220,${a})`);
        });
        break;
      }
      acc += dur + .6;
    }
  }
  requestAnimationFrame(frame);
}

resize();
fetch('/api/letter' + location.search).then(r => r.json()).then(j => { cfg = j; Knight.setHue(j.hue || 0); t0 = performance.now(); }).catch(() => {})
  .finally(() => requestAnimationFrame(frame));
</script>
